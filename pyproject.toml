[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "janestreet-repro"
version = "0.1.0"
description = "Causal Jane Street forecasting protocol and GRU research harness"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "polars>=1.30,<2",
    "torch>=2.6,<3",
    "PyYAML>=6,<7",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
js-repro = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
